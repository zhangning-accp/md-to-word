[package]
name = "md-to-word"
version = "3.0.0"
edition = "2024"
rust-version = "1.86"
description = "低内存 Markdown 转 Word 桌面工具，支持可编辑数学公式"
license = "MIT"

[dependencies]
pulldown-cmark = { version = "=0.13.0", default-features = false }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
latex2mathml = "=0.2.3"
roxmltree = { version = "=0.20.0", default-features = false, features = ["std"] }
imagesize = { version = "=0.14.0", default-features = false, features = ["png", "jpeg"] }
percent-encoding = "=2.3.1"
tempfile = "=3.19.1"

[build-dependencies]
winres = "=0.1.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.60.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.2"
objc2-foundation = { version = "=0.3.1", default-features = false, features = ["std", "NSArray", "NSString", "NSObject", "NSNotification", "NSURL", "NSTimer", "NSRunLoop"] }
objc2-app-kit = { version = "=0.3.1", default-features = false, features = ["std", "objc2-core-foundation", "NSGraphics", "NSRunningApplication", "NSButtonCell", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSControl", "NSButton", "NSCell", "NSColor", "NSFont", "NSTextField", "NSText", "NSTextView", "NSScrollView", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSMenu", "NSMenuItem", "NSWorkspace", "NSAlert", "NSBox"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
